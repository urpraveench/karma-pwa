apply plugin: 'com.android.application'

// The app's version is package.json's, as on the web and in Setup › About (AND-06). Play needs a version code that rises
// with every upload: the version times 100 plus a build number (TIKTYM_ANDROID_BUILD, 0 to 99, default 0), so 1.4.2 is
// 100400200 and a second test upload of it, build 1, is 100400201; each release (CLAUDE.md › Releasing) gets a higher one.
def appVersion = new groovy.json.JsonSlurper().parse(file('../../package.json')).version
def androidBuild = (System.getenv('TIKTYM_ANDROID_BUILD') ?: '0') as int
if (androidBuild < 0 || androidBuild > 99) throw new GradleException("TIKTYM_ANDROID_BUILD must be 0 to 99")
def appVersionCode = appVersion.tokenize('.').collect { it.replaceAll(/\D.*/, '') as int }.with { (it[0] * 1000000 + it[1] * 1000 + it[2]) * 100 + androidBuild }

// The upload key that signs Play uploads lives outside the repo (AND-10): ~/.tiktym/upload-key.properties, or the file
// TIKTYM_UPLOAD_KEY names, with storeFile, storePassword, keyAlias and keyPassword. Google re-signs for users (Play App Signing).
def uploadKeyFile = file(System.getenv('TIKTYM_UPLOAD_KEY') ?: "${System.getProperty('user.home')}/.tiktym/upload-key.properties")
def uploadKey = new Properties()
if (uploadKeyFile.exists()) uploadKeyFile.withInputStream { uploadKey.load(it) }
gradle.taskGraph.whenReady { graph ->
    if (!uploadKeyFile.exists() && graph.allTasks.any { it.name ==~ /(bundle|assemble)Release/ })
        throw new GradleException("No upload key at ${uploadKeyFile}: a release build needs it (README.md › Android app)")
}

android {
    namespace = "com.tiktym.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.tiktym.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (uploadKeyFile.exists()) {
                storeFile file(uploadKey.storeFile)
                storePassword uploadKey.storePassword
                keyAlias uploadKey.keyAlias
                keyPassword uploadKey.keyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
