<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1B19" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Karma">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Karma</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{
  --bg:#EDF0EA;--surface:#F8FAF6;--surface-2:#E2E8E0;--ink:#16302E;--ink-2:#55685F;--line:#CBD5CA;
  --due:#B42318;--due-soft:#F2D6D0;--gold:#C98E0E;--ok:#24724F;
  --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1B19;--surface:#162624;--surface-2:#1F322F;--ink:#E4ECE7;--ink-2:#93A89F;--line:#2C433F;
  --due:#F07A68;--due-soft:#3B2421;--gold:#E6B23C;--ok:#5BC08F;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1B19;--surface:#162624;--surface-2:#1F322F;--ink:#E4ECE7;--ink-2:#93A89F;--line:#2C433F;
  --due:#F07A68;--due-soft:#3B2421;--gold:#E6B23C;--ok:#5BC08F;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
.app{max-width:540px;margin:0 auto;padding:18px 18px 130px}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
.date{margin:0;color:var(--ink-2);font-size:15px}
.hello{font-size:clamp(25px,7.2vw,30px);font-weight:800;letter-spacing:-.02em}
.streak{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.streak b{font-family:var(--f-display);font-size:28px;font-weight:800;color:var(--gold)}
.streak span{font-size:13px;color:var(--ink-2)}

/* mala */
.mala{position:relative;width:min(80vw,310px);aspect-ratio:1;margin:8px auto 4px}
.mala svg{width:100%;height:100%;display:block}
.bd{transition:fill .4s}
.intro .bd{animation:bead .45s both}
@keyframes bead{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
.bd{transform-box:fill-box;transform-origin:center}
.mala-center{position:absolute;inset:18%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(56px,17vw,76px);line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lbl{font-size:15px;color:var(--ink-2);margin-top:4px}
.carry{margin-top:8px;font-size:13px;font-weight:600;color:var(--due);background:var(--due-soft);padding:3px 10px;border-radius:999px}
.clear-word{font-family:var(--f-display);font-weight:800;font-size:44px;color:var(--ok);letter-spacing:-.02em}
.legend{display:flex;justify-content:center;gap:16px;font-size:13px;color:var(--ink-2);margin:0 0 22px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:1px}

/* categories */
.sect-h{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.sect-h h2{font-size:20px;font-weight:700}
.sect-h small{color:var(--ink-2);font-size:14px}
.cat{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.cat-open{flex:1;min-width:0;display:grid;grid-template-columns:6px 1fr;gap:14px;align-items:center;text-align:left;padding:14px 10px 14px 12px}
.cat-open:active{background:var(--surface-2)}
.cat-stripe{align-self:stretch;border-radius:4px;background:var(--c)}
.cat-name{font-weight:700;font-size:17px;display:block}
.cat-meta{font-size:13.5px;color:var(--ink-2);display:block;margin:1px 0 9px}
.bar{display:flex;height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%}
.b-done{background:var(--c)}
.b-carry{background:var(--due);opacity:.55}
.qbtn{flex:none;width:62px;height:62px;margin-right:12px;border-radius:50%;background:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;display:grid;place-items:center;box-shadow:0 4px 12px color-mix(in srgb,var(--c) 38%,transparent);transition:transform .12s}
.qbtn:active{transform:scale(.9)}
.qbtn.done{background:transparent;color:var(--ok);box-shadow:none;border:2px solid var(--line);font-size:24px}
.qbtn.run{background:var(--due)}
.tbtn{flex:none;width:46px;height:46px;margin-right:8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,var(--line));color:var(--c);display:grid;place-items:center;transition:transform .12s}
.tbtn svg{width:18px;height:18px;margin-left:2px}
.tbtn:active{transform:scale(.9)}
.tbtn.live{background:var(--c);border-color:var(--c);color:#fff;font-family:var(--f-display);font-weight:800;font-size:14px;animation:pulse 1.6s infinite}
.tbtn.live svg{margin-left:0}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1.5px solid var(--gold);border-radius:16px;padding:12px 8px 12px 14px;margin:0 0 12px;font-size:14.5px}
.tip p{margin:0;flex:1}
.tip .x{flex:none}
.tip-play{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center}
.tip-play svg{width:14px;height:14px;margin-left:2px}
.bd.live{animation:livebead 1.6s ease-in-out infinite}
@keyframes livebead{50%{opacity:.35}}
body.has-timer .app{padding-bottom:200px}
body.has-timer .toast{bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.toast{min-width:min(260px,90vw);justify-content:space-between}
.mini{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:19;max-width:516px;margin:0 auto;display:flex;align-items:center;gap:6px;
  background:var(--ink);color:var(--bg);border-radius:18px;padding:8px 8px 8px 6px;overflow:hidden;box-shadow:0 8px 24px rgba(10,20,18,.25);animation:up .25s}
.mini-open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left;padding:4px 8px;color:inherit}
.mini .pulse{flex:none;width:11px;height:11px;border-radius:50%;background:var(--c);animation:pulse 1.6s infinite}
.mini.paused .pulse{animation:none;opacity:.5}
.mini-t{min-width:0;line-height:1.15}
.mini-t b{display:block;font-family:var(--f-display);font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mini-t small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-btn{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;color:var(--bg);background:color-mix(in srgb,var(--bg) 14%,transparent)}
.mini-btn svg{width:20px;height:20px}
.mini-stop{width:auto;padding:0 14px;background:var(--bg);color:var(--ink);font-weight:700;font-size:15px}
.mini-prog{position:absolute;left:0;bottom:0;height:3px;background:var(--c);transition:width 1s linear}
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(18px + env(safe-area-inset-bottom,0px));animation:up .3s cubic-bezier(.2,.8,.2,1);overflow-y:auto}
.focus>*{width:100%;max-width:500px;margin-left:auto;margin-right:auto}
.f-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.f-wake{font-size:13px;color:var(--ink-2)}
.f-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 0}
.f-name{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px;font-weight:800;margin:0}
.f-name i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.f-ring{position:relative;width:min(80vw,330px);aspect-ratio:1}
.f-ring svg{width:100%;height:100%;display:block}
.f-arc{transition:stroke-dashoffset 1s linear}
.f-center{position:absolute;inset:16%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.f-center b{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,16vw,72px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.f-center .f-pts{margin-top:8px;font-weight:700;color:var(--c)}
.f-center .f-sub{font-size:14.5px;color:var(--ink-2)}
.focus.paused .f-center b{animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.f-goal{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
.f-goal span{font-size:14px;color:var(--ink-2);margin-right:2px}
.f-goal .chip{padding:7px 13px;font-size:14px}
.f-actions{display:grid;gap:10px}
.focus .f-stop{background:var(--c);color:#fff;height:66px;font-size:18px;border-radius:18px}
.f-min{font-weight:600;padding:10px 4px;display:flex;align-items:center;gap:6px}
.f-min svg{width:20px;height:20px}
.coach{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 18px 8px;margin:4px 0 16px}
.coach h2{font-family:var(--f-body);font-size:14px;font-weight:600;opacity:.7;margin:0 0 10px}
.coach ul{margin:0;padding:0}
.coach li{list-style:none;display:grid;grid-template-columns:4px 1fr;gap:12px;padding:11px 0;border-top:1px solid color-mix(in srgb,var(--bg) 16%,transparent);font-size:15.5px;line-height:1.42}
.coach li:first-child{border-top:0;padding-top:2px}
.coach li i{border-radius:3px;background:var(--tone)}
.wk{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden}
.wk>div{padding:12px 12px 12px 14px;border-left:1px solid var(--line);min-width:0}
.wk>div:first-child{border-left:0}
.wk b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.wk .l{display:block;font-size:12.5px;color:var(--ink-2)}
.delta{display:block;font-size:13px;font-weight:700;margin-top:2px}
.delta.up{color:var(--ok)}.delta.down{color:var(--due)}.delta.flat{color:var(--ink-2)}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel-h small{color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.heat text{font-family:var(--f-body);font-size:9.5px;fill:var(--ink-2)}
.hkey{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:12px;color:var(--ink-2);margin-top:8px}
.hkey i{width:11px;height:11px;border-radius:3px;display:inline-block}
.ph{padding:12px 0;border-top:1px solid var(--line)}
.ph:first-of-type{border-top:0;padding-top:4px}
.ph-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.ph-name{font-weight:700;display:flex;align-items:center;gap:8px}
.ph-name i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.ph-st{font-family:var(--f-display);font-weight:800;font-size:15px;white-space:nowrap}
.ph-st.zero{color:var(--ink-2);font-family:var(--f-body);font-weight:500;font-size:13.5px}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip i{height:16px;border-radius:4px;background:var(--surface-2)}
.strip .met{background:var(--c)}
.strip .part{background:color-mix(in srgb,var(--c) 38%,var(--surface-2))}
.strip .miss{background:var(--due-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--due) 45%,transparent)}
.strip .rest{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line)}
.strip .today{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.strip .none{opacity:.35}
.ph-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:7px;gap:8px}
.ph-meta .up{color:var(--ok);font-weight:700}.ph-meta .down{color:var(--due);font-weight:700}
.ms{padding:10px 0;border-top:1px solid var(--line)}
.ms:first-of-type{border-top:0;padding-top:2px}
.ms-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.ms-top b{font-weight:700}
.ms-top span{font-size:13.5px;color:var(--ink-2)}
.ms .bar{height:10px}
.ms .bar i{background:var(--gold);border-radius:5px}
.recs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.recs div{background:var(--bg);padding:10px 12px}
.recs b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.15}
.recs span{font-size:12.5px;color:var(--ink-2)}
.tod{display:flex;height:34px;border-radius:10px;overflow:hidden;margin:4px 0 8px}
.tod i{display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.tod-key{display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;color:var(--ink-2);gap:4px}
.tod-key span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--k);margin-right:5px}
.detail-h{margin:26px 2px 10px}
.moment{position:relative;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--tone) 50%,var(--line));border-radius:20px;padding:16px 16px 14px 20px;margin:10px 0 6px;animation:fade .5s}
.moment::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--tone)}
.m-x{position:absolute;top:6px;right:6px}
.m-title{font-size:21px;font-weight:800;margin:0 34px 4px 0;letter-spacing:-.01em}
.m-body{margin:0;color:var(--ink-2);font-size:15px;line-height:1.45}
.m-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 2px}
.m-stats b{display:block;font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.m-stats span{font-size:12.5px;color:var(--ink-2);line-height:1.25;display:block}
.m-bar{margin-top:12px;height:8px}
.m-bar i{background:var(--tone)}
.m-cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;height:52px;border-radius:14px;background:var(--tone);color:#fff;font-weight:700;font-size:15.5px;transition:transform .12s}
.m-cta:active{transform:scale(.97)}
.m-cta svg{width:15px;height:15px;flex:none}
.m-recap{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.m-recap .m-body,.m-recap .m-stats span{color:color-mix(in srgb,var(--bg) 72%,transparent)}
.m-recap .x{color:var(--bg);opacity:.7}
.m-recap .m-cta{color:#fff}
.mala.sm{width:min(64vw,250px)}
.mala.sm .big{font-size:clamp(46px,14vw,62px)}
.mala-center .soft{margin-top:8px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:3px 10px;border-radius:999px}
.row-hint{font-size:13px;color:var(--ink-2);text-align:center;margin:6px 0 0}
.timer{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);border-radius:18px;padding:10px 10px 10px 16px;margin:10px 0 4px}
.timer .pulse{flex:none;width:11px;height:11px;border-radius:50%;background:var(--c);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 70%,transparent)}70%{box-shadow:0 0 0 12px transparent}100%{box-shadow:0 0 0 0 transparent}}
.timer .tt{flex:1;line-height:1.15;min-width:0}
.timer .tt b{font-family:var(--f-display);font-size:28px;font-variant-numeric:tabular-nums;display:block}
.timer .tt small{opacity:.75;font-size:13px}
.tstop{background:var(--bg);color:var(--ink);font-weight:700;border-radius:14px;padding:13px 16px;font-size:15px}
.timer .x{color:var(--bg);opacity:.7}
.nudge{background:var(--due-soft);color:var(--due);font-weight:600;border-radius:14px;padding:10px 14px;margin:2px 0 12px;text-align:center;font-size:14.5px}
.pick{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 14px;padding:2px 20px 4px;scrollbar-width:none}
.pick::-webkit-scrollbar{display:none}
.pick .chip{flex:none;padding:11px 16px}
.seg-full{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;margin-bottom:14px}
.seg-full button{padding:10px 2px}
.tile-all{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--c);color:#fff;border-radius:18px;padding:0 20px;height:70px;font-weight:700;font-size:17px;margin-bottom:10px;transition:transform .12s}
.tile-all b{font-family:var(--f-display);font-size:32px;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{height:62px;border-radius:16px;background:var(--surface-2);font-family:var(--f-display);font-weight:800;font-size:22px;transition:transform .12s}
.tile:active,.tile-all:active{transform:scale(.95)}
.tile-ghost{background:transparent;border:1.5px dashed var(--line);font-family:var(--f-body);font-size:15px;font-weight:600;color:var(--ink-2)}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.link{font-weight:600;font-size:15px;padding:12px 4px;text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--line)}
.sheet-sub{margin:-10px 0 16px;color:var(--ink-2);font-size:14px}
.custom{margin-top:14px}
input[type=date].in{-webkit-appearance:none;appearance:none;min-height:50px;display:block;text-align:left;margin-bottom:14px}
input[type=date].in::-webkit-date-and-time-value{text-align:left}
.preset{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.preset .chip{padding:8px 13px}
.since{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:4px 4px 4px 14px}
.celebrate{position:fixed;inset:0;z-index:70;background:color-mix(in srgb,var(--bg) 94%,transparent);display:grid;place-items:center;text-align:center;padding:24px;animation:fade .25s}
.cel-mark{width:160px;height:160px;margin:0 auto 10px;display:block;animation:spin 1.3s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{from{transform:rotate(-140deg) scale(.5);opacity:0}}
.celebrate .clear-word{font-size:52px;display:block}
.celebrate p{margin:4px 0 22px;color:var(--ink-2);font-size:17px}
.celebrate .btn{width:auto;padding:12px 22px;margin:0 auto}
.streak small{font-size:12px;color:var(--ink-2);margin-top:2px}
.tundo{color:var(--gold);font-weight:800;padding:6px 2px;font-size:15px}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:18px;padding:22px;text-align:center;color:var(--ink-2)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}

<body>
<div id="root"></div>
<script type="module">
/* ============================ config + utils ============================ */
const CFG = Object.assign({ mode:'local', devCredentials:{email:'demo@karma.local',password:'karma123'}, showDevHint:true, enableGoogle:false, firebase:{} }, window.KARMA_CONFIG || {});
const FIREBASE_READY = CFG.mode === 'firebase' && !!(CFG.firebase && CFG.firebase.apiKey && CFG.firebase.projectId);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today = () => ymd(new Date());
const newId = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = a => a.reduce((x,y) => x+y, 0);
const fmtLong = s => parse(s).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});
const fmtShort = s => parse(s).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const WD = ['S','M','T','W','T','F','S'];
const COLORS = ['#1F8A70','#3E5BA9','#A0740A','#8A4FA3','#C2410C','#0E7490','#BE185D','#4D7C0F'];
const $ = sel => document.querySelector(sel);
const ICON = {
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="4" r="1.6" fill="currentColor"/></svg>',
  insights:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>',
  history:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.4-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1.2"/><rect x="14" y="4.5" width="4" height="15" rx="1.2"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/* ============================ storage adapters ============================ */
function LocalStore(key){
  const K = 'karma:data:' + key;
  let db; try { db = JSON.parse(localStorage.getItem(K)); } catch { db = null; }
  db = db || { categories:[], logs:[], settings:{} };
  const save = () => { try { localStorage.setItem(K, JSON.stringify(db)); } catch { toast('Could not save on this device'); } };
  return {
    kind:'local',
    async loadAll(){ return JSON.parse(JSON.stringify(db)); },
    async putCategory(c){ const i = db.categories.findIndex(x => x.id === c.id); if (i >= 0) db.categories[i] = c; else db.categories.push(c); save(); },
    async deleteCategory(id){ db.categories = db.categories.filter(c => c.id !== id); db.logs = db.logs.filter(l => l.catId !== id); save(); },
    async addLog(l){ db.logs.push(l); save(); },
    async deleteLog(l){ const id = typeof l === 'string' ? l : l.id; db.logs = db.logs.filter(x => x.id !== id); save(); },
    async putSettings(s){ db.settings = s; save(); },
    async replaceAll(d){ db = JSON.parse(JSON.stringify(d)); save(); },
  };
}

// Firestore layout (schema 2): logs are bucketed into one doc per month, keyed by log id.
// A year of history costs ~12 reads per app open instead of one read per log entry.
//   users/{uid}/categories/{id}   users/{uid}/months/{YYYY-MM} { entries: { [logId]: log } }   users/{uid}/meta/settings
function FirebaseStore(FB, uid){
  const f = FB.fs, db = FB.db;
  const cats = () => f.collection(db, 'users', uid, 'categories');
  const months = () => f.collection(db, 'users', uid, 'months');
  const monthRef = m => f.doc(db, 'users', uid, 'months', m);
  const legacyLogs = () => f.collection(db, 'users', uid, 'logs');
  const settingsDoc = () => f.doc(db, 'users', uid, 'meta', 'settings');
  const mk = d => d.slice(0, 7);
  const group = logs => { const g = {}; for (const l of logs) (g[mk(l.date)] ||= {})[l.id] = l; return g; };
  const commitChunks = async ops => { for (let i = 0; i < ops.length; i += 400) { const b = f.writeBatch(db); ops.slice(i, i + 400).forEach(op => op(b)); await b.commit(); } };
  async function migrateLegacy(){ // schema 1 stored one doc per log
    const old = await f.getDocs(legacyLogs()); if (old.empty) return;
    const g = group(old.docs.map(d => d.data()));
    await commitChunks([...Object.entries(g).map(([m, entries]) => b => b.set(monthRef(m), { entries }, { merge:true })), ...old.docs.map(d => b => b.delete(d.ref))]);
  }
  async function wipe(){
    const [c, m, l] = await Promise.all([f.getDocs(cats()), f.getDocs(months()), f.getDocs(legacyLogs())]);
    await commitChunks([...c.docs, ...m.docs, ...l.docs].map(x => b => b.delete(x.ref)));
  }
  return {
    kind:'firebase',
    async loadAll(){
      let [c, mo, s] = await Promise.all([f.getDocs(cats()), f.getDocs(months()), f.getDoc(settingsDoc())]);
      let settings = s.exists() ? s.data() : {};
      if (settings.schema !== 2) { await migrateLegacy(); settings = { ...settings, schema:2 }; await f.setDoc(settingsDoc(), settings, { merge:true }); mo = await f.getDocs(months()); }
      return { categories: c.docs.map(d => d.data()), logs: mo.docs.flatMap(d => Object.values(d.data().entries || {})), settings };
    },
    putCategory: c => f.setDoc(f.doc(cats(), c.id), c),
    async deleteCategory(id){
      const mo = await f.getDocs(months()), ops = [];
      mo.docs.forEach(d => { const upd = {}; Object.values(d.data().entries || {}).forEach(l => { if (l.catId === id) upd[`entries.${l.id}`] = f.deleteField(); }); if (Object.keys(upd).length) ops.push(b => b.update(d.ref, upd)); });
      ops.push(b => b.delete(f.doc(cats(), id)));
      await commitChunks(ops);
    },
    addLog: l => f.setDoc(monthRef(mk(l.date)), { entries: { [l.id]: l } }, { merge:true }),
    deleteLog: l => f.updateDoc(monthRef(mk(l.date)), { [`entries.${l.id}`]: f.deleteField() }),
    putSettings: s => f.setDoc(settingsDoc(), { ...s, schema:2 }, { merge:true }),
    async replaceAll(d){
      await wipe();
      await commitChunks([
        ...d.categories.map(x => b => b.set(f.doc(cats(), x.id), x)),
        ...Object.entries(group(d.logs)).map(([m, entries]) => b => b.set(monthRef(m), { entries })),
        b => b.set(settingsDoc(), { ...(d.settings || {}), schema:2 }),
      ]);
    },
    async deleteAccount(){ // data first, then the auth user (may require a recent sign-in)
      await wipe(); await f.deleteDoc(settingsDoc());
      await FB.A.deleteUser(FB.auth.currentUser);
    },
  };
}

let FB = null;
async function loadFirebase(){
  const v = '10.12.2', base = `https://www.gstatic.com/firebasejs/${v}`;
  const [app, auth, fs] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
  const a = app.initializeApp(CFG.firebase);
  let db; try { db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache() }); } catch { db = fs.getFirestore(a); }
  return { auth: auth.getAuth(a), A: auth, db, fs };
}

/* ============================ state ============================ */
const S = { user:null, store:null, data:{categories:[],logs:[],settings:{}}, view:'today', range:7, intro:true };

function defaultCategories(start){
  return [['Exercise',30,COLORS[0]],['Reading',30,COLORS[1]],['Course study',30,COLORS[2]],['Meditation',10,COLORS[3]]]
    .map(([name,minutes,color],i) => ({ id:newId(), name, color, order:i, startDate:start, archivedFrom:null, targets:[{from:start, minutes, days:[0,1,2,3,4,5,6]}] }));
}

/* ============================ backlog engine ============================ */
// Per category, per day: carried(end) = max(0, carried(prev) + due(today) - logged(today)).
// Logging more than owed does not bank credit for future days.
function dueOn(cat, d){
  if (d < cat.startDate) return 0;
  if (cat.archivedFrom && d >= cat.archivedFrom) return 0;
  let t = null; for (const x of cat.targets) if (x.from <= d) t = x;
  if (!t) t = cat.targets[0];
  return t && t.days.includes(parse(d).getDay()) ? t.minutes : 0;
}
function targetMinutesOn(cat, d){ let t = null; for (const x of cat.targets) if (x.from <= d) t = x; return (t || cat.targets[0])?.minutes || 0; }
const capDays = () => { const v = S.data.settings?.backlogCap; return v === undefined ? 2 : Number(v); };
function activeCats(){ return S.data.categories.filter(c => !c.archivedFrom || c.archivedFrom > today()).sort((a,b) => (a.order??0) - (b.order??0)); }
function calc(asOf = today()){
  const done = {};
  for (const l of S.data.logs) { (done[l.catId] ||= {}); done[l.catId][l.date] = (done[l.catId][l.date] || 0) + l.minutes; }
  const per = {}, cd = capDays();
  for (const c of S.data.categories) {
    let carry = 0; const byDate = new Map(); let last = null;
    for (let d = c.startDate; d <= asOf; d = addDays(d, 1)) {
      const due = dueOn(c, d), dn = (done[c.id] || {})[d] || 0;
      if (c.archivedFrom && d >= c.archivedFrom) carry = 0;
      if (cd > 0) carry = Math.min(carry, cd * targetMinutesOn(c, d)); // older misses beyond the cap are forgiven
      const row = { date:d, due, done:dn, opening:carry, owed:carry + due, end:Math.max(0, carry + due - dn) };
      byDate.set(d, row); carry = row.end; last = row;
    }
    per[c.id] = { byDate, today: last && last.date === asOf ? last : { date:asOf, due:0, done:(done[c.id]||{})[asOf]||0, opening:0, owed:0, end:0 } };
  }
  const act = activeCats();
  const t = (k) => sum(act.map(c => per[c.id].today[k]));
  const totals = { due:t('due'), opening:t('opening'), owed:t('owed'), end:t('end'),
    doneCap: sum(act.map(c => Math.min(per[c.id].today.done, per[c.id].today.owed))),
    done: t('done'),
    carryLeft: sum(act.map(c => Math.max(0, per[c.id].today.opening - per[c.id].today.done))) };
  // streak: consecutive clear days (nothing pending at day end), counting today only if clear
  const dayEnd = d => sum(S.data.categories.map(c => per[c.id].byDate.get(d)?.end || 0));
  const dayDue = d => sum(S.data.categories.map(c => per[c.id].byDate.get(d)?.owed || 0));
  const earliest = S.data.categories.reduce((m,c) => c.startDate < m ? c.startDate : m, asOf);
  let streak = 0, d = dayEnd(asOf) === 0 && totals.owed > 0 ? asOf : addDays(asOf, -1);
  while (d >= earliest && dayEnd(d) === 0) { if (dayDue(d) > 0) streak++; d = addDays(d, -1); }
  let best = 0, run = 0;
  for (let x = earliest; x < asOf; x = addDays(x, 1)) { if (dayEnd(x) === 0) { if (dayDue(x) > 0) run++; } else run = 0; best = Math.max(best, run); }
  best = Math.max(best, streak);
  return { per, totals, streak, best, done };
}

/* ============================ moments: one context-aware card per day ============================ */
const round5 = v => Math.max(5, Math.round(v / 5) * 5);
function firstName(){
  const raw = S.user?.name && S.user.name !== 'Test user' ? S.user.name : (S.user?.email || '').split('@')[0];
  const w = (raw || '').split(/[\s._\-0-9]+/).filter(Boolean)[0]; return w && w.length > 1 ? w[0].toUpperCase() + w.slice(1).toLowerCase() : '';
}
function dayAll(c, d){ let due = 0, done = 0, end = 0, owed = 0; for (const cat of S.data.categories) { const r = c.per[cat.id].byDate.get(d); if (!r) continue; due += r.due; done += r.done; end += r.end; owed += r.owed; } return { d, due, done, end, owed }; }
function showUpStreak(){ const days = new Set(S.data.logs.filter(l => l.minutes > 0).map(l => l.date)); let n = 0, d = days.has(today()) ? today() : addDays(today(), -1); while (days.has(d)) { n++; d = addDays(d, -1); } return n; }
function usualHour(catId){ const since = addDays(today(), -30); const hs = S.data.logs.filter(l => l.catId === catId && l.date >= since && l.createdAt).map(l => new Date(l.createdAt).getHours()).sort((a,b) => a - b); return hs.length >= 5 ? hs[Math.floor(hs.length / 2)] : null; }
const monthName = d => parse(d).toLocaleDateString(undefined, { month:'long' });
const hourLabel = h => new Date(2000, 0, 1, h).toLocaleTimeString(undefined, { hour:'numeric' });

function moment(c){
  const T = today(), now = parse(T), hour = new Date().getHours(), cats = activeCats(), t = c.totals;
  if (!cats.length) return null;
  const earliest = cats.reduce((m,x) => x.startDate < m ? x.startDate : m, T);
  const histDays = Math.round((parse(T) - parse(earliest)) / 864e5);
  const pending = cats.filter(x => c.per[x.id].today.end > 0);
  const easiest = [...pending].sort((a,b) => targetMinutesOn(a, T) - targetMinutesOn(b, T))[0];
  const minGoal = easiest ? Math.min(15, round5(Math.min(targetMinutesOn(easiest, T), c.per[easiest.id].today.end))) : 10;
  const hidden = localStorage.getItem('karma:moment:' + T);
  const out = [], add = (key, prio, o) => { if (hidden !== key) out.push({ key, prio, ...o }); };
  const name = firstName(), logged = new Set(S.data.logs.map(l => l.date));
  const sched = (from, to) => { let due = 0, met = 0, clear = 0, days = 0; for (let d = from < earliest ? earliest : from; d <= to; d = addDays(d, 1)) { const r = dayAll(c, d); if (r.due > 0) { due += r.due; met += Math.min(r.done, r.due); } if (r.owed > 0) { days++; if (r.end === 0) clear++; } } return { due, met, clear, days, hit: due ? Math.round(met / due * 100) : null }; };

  // 1. month recap, first three days of a month
  if (now.getDate() <= 3) {
    const pmStart = ymd(new Date(now.getFullYear(), now.getMonth() - 1, 1)), pmEnd = addDays(ymd(new Date(now.getFullYear(), now.getMonth(), 1)), -1);
    const ppStart = ymd(new Date(now.getFullYear(), now.getMonth() - 2, 1));
    const ptsIn = (a, b) => sum(S.data.logs.filter(l => l.date >= a && l.date <= b).map(l => l.minutes));
    const pts = ptsIn(pmStart, pmEnd), prev = ptsIn(ppStart, addDays(pmStart, -1));
    if (pts > 0) {
      const st = sched(pmStart, pmEnd);
      let best = null; for (const cat of cats) { let due = 0, dn = 0; for (let d = pmStart; d <= pmEnd; d = addDays(d, 1)) { const r = c.per[cat.id].byDate.get(d); if (r) { due += r.due; dn += Math.min(r.done, r.due); } } if (due && (!best || dn / due > best.p)) best = { cat, p: dn / due }; }
      const delta = prev ? Math.round((pts - prev) / prev * 100) : null;
      add('month', 100, { recap:true, tone:'var(--gold)', title:`${monthName(pmStart)}, wrapped${name ? `, ${name}` : ''}`,
        body: delta === null ? 'Your first full month on record. Here\'s what you built.' : delta >= 0 ? `${delta}% more practice than ${monthName(ppStart)}. That's real growth.` : `${-delta}% less than ${monthName(ppStart)}. A new month is a clean page.`,
        stats:[[`${(pts / 60).toFixed(pts >= 600 ? 0 : 1)} h`, 'practised'], [`${st.clear}/${st.days}`, 'days cleared'], [best ? `${Math.round(best.p * 100)}%` : '—', best ? `${esc(best.cat.name)}, your best` : 'best practice']],
        cta: easiest && { label:`${minGoal} min of ${esc(easiest.name)} to start ${monthName(T).slice(0,3)}`, cat:easiest.id, goal:minGoal } });
    }
  }
  // 2. comeback: nothing logged for the last two days, and nothing yet today
  if (easiest && histDays >= 3 && !logged.has(T) && !logged.has(addDays(T, -1)) && !logged.has(addDays(T, -2))) {
    let gap = 1; while (gap < 90 && !logged.has(addDays(T, -gap)) && addDays(T, -gap) >= earliest) gap++;
    add('comeback', 95, { tone:'#0E7490', minMode:true, minGoal, title: name ? `Welcome back, ${name}.` : 'Welcome back.',
      body:`It's been ${gap - 1} days. No catching up today. ${minGoal} minutes of ${esc(easiest.name)} makes today count.`,
      cta:{ label:`Start ${minGoal} min of ${esc(easiest.name)}`, cat:easiest.id, goal:minGoal } });
  }
  // 3. weekend push: Sat/Sun and behind the weekly pace
  const dow = (now.getDay() + 6) % 7, mon = addDays(T, -dow);
  let wkTarget = 0, wkDone = 0, toDate = 0; const gaps = {};
  for (let i = 0; i < 7; i++) { const d = addDays(mon, i);
    for (const cat of cats) { const r = c.per[cat.id].byDate.get(d), due = d <= T ? (r?.due || 0) : dueOn(cat, d); wkTarget += due;
      if (d <= T) { wkDone += r?.done || 0; if (d < T) toDate += due; gaps[cat.id] = (gaps[cat.id] || 0) + due - (r?.done || 0); } } }
  const short = wkTarget - wkDone;
  if (dow >= 5 && wkTarget > 0 && short > 0 && wkDone < toDate * .92) {
    const left = 7 - dow, perDay = Math.ceil(short / left);
    const focus = [...pending].sort((a,b) => (gaps[b.id] || 0) - (gaps[a.id] || 0))[0];
    add('weekend', 90, { tone:'#A0740A', title: dow === 5 ? `Weekend push${name ? `, ${name}` : ''}` : 'Last day of the week',
      body:`You're ${short} points short of this week's ${wkTarget}. ${left === 2 ? `About ${perDay} a day this weekend closes it.` : `${short} today closes it.`}${focus ? ` Biggest gap: ${esc(focus.name)}.` : ''}`,
      stats:[[wkDone, 'done this week'], [wkTarget, 'weekly goal'], [perDay, left === 2 ? 'a day to close' : 'to close today']], bar: Math.min(100, wkDone / wkTarget * 100),
      cta: focus && { label:`Start ${esc(focus.name)}`, cat:focus.id, goal:Math.min(60, Math.max(10, c.per[focus.id].today.end)) } });
  }
  // 4. minimum day: last 7 days under 60% of target
  const wk7 = sched(addDays(T, -7), addDays(T, -1));
  if (easiest && wk7.hit !== null && wk7.due > 0 && histDays >= 5 && wk7.hit < 60 && t.done < minGoal) {
    add('minimum', 85, { tone:'#A0740A', minMode:true, minGoal, title:'Make today a minimum day.',
      body:`Last week came in at ${wk7.hit}% of target. Skip the full ${t.end} today. ${minGoal} minutes keeps the chain alive, and small wins compound.`,
      cta:{ label:`Do ${minGoal} min of ${esc(easiest.name)}`, cat:easiest.id, goal:minGoal } });
  }
  // 5. best month in reach: last two days of a month
  const monthEnd = addDays(ymd(new Date(now.getFullYear(), now.getMonth() + 1, 1)), -1), daysLeftM = Math.round((parse(monthEnd) - now) / 864e5) + 1;
  if (daysLeftM <= 2) {
    const mStart = ymd(new Date(now.getFullYear(), now.getMonth(), 1)), mPts = sum(S.data.logs.filter(l => l.date >= mStart).map(l => l.minutes));
    const byMonth = {}; S.data.logs.filter(l => l.date < mStart).forEach(l => { const k = l.date.slice(0, 7); byMonth[k] = (byMonth[k] || 0) + l.minutes; });
    const bestPrev = Math.max(0, ...Object.values(byMonth));
    if (bestPrev > 0 && mPts < bestPrev && bestPrev - mPts <= Math.max(t.owed, 30) * daysLeftM * 1.5)
      add('bestmonth', 80, { tone:'var(--ok)', title:'Best month in reach.', body:`${bestPrev - mPts + 1} more points by ${fmtShort(monthEnd)} makes ${monthName(T)} your best month yet.`, bar: mPts / bestPrev * 100,
        cta: easiest && { label:`Start ${esc(easiest.name)}`, cat:easiest.id, goal:Math.min(60, Math.max(10, c.per[easiest.id].today.end)) } });
    else if (bestPrev > 0 && mPts >= bestPrev)
      add('bestmonth', 80, { tone:'var(--ok)', title:`${monthName(T)} is already your best month.`, body:`${mPts} points so far, ahead of your previous best of ${bestPrev}. Finish it strong.` });
  }
  // 6. fresh week (Monday)
  if (dow === 0) { const lw = sched(addDays(T, -7), addDays(T, -1));
    if (lw.hit !== null) add('monday', 60, { tone:'var(--ok)', title:'Fresh week.', body:`Last week: ${lw.hit}% of target and ${lw.clear} clear day${lw.clear === 1 ? '' : 's'}. Clear today and you're already ahead of it.`,
      cta: easiest && { label:`Start with ${esc(easiest.name)}`, cat:easiest.id, goal:Math.min(60, Math.max(10, c.per[easiest.id].today.end)) } }); }
  // 7. habit cue: within an hour of when this practice is usually logged
  for (const cat of pending) { const h = usualHour(cat.id);
    if (h !== null && Math.abs(h - hour) <= 1) { add('habit', 55, { tone:cat.color, title:`It's your usual ${esc(cat.name)} time.`, body:`You usually get ${esc(cat.name)} done around ${hourLabel(h)}. ${c.per[cat.id].today.end} left today.`,
      cta:{ label:`Start ${esc(cat.name)}`, cat:cat.id, goal:Math.min(60, Math.max(5, c.per[cat.id].today.end)) } }); break; } }
  // 8. on a roll
  if (c.streak >= 3 && t.end > 0) add('roll', 40, { tone:'var(--gold)', title: c.best - c.streak <= 1 && c.best > c.streak ? 'A new record is one day away.' : `Day ${c.streak + 1} is waiting.`,
    body:`${c.streak} clear days in a row. ${t.end} points keeps it going.` });
  // 9. new user
  if (histDays < 3 && !logged.has(T) && easiest) add('start', 30, { tone:'var(--ok)', title: name ? `Start small, ${name}.` : 'Start small.', body:'Log anything today, even 5 minutes. Showing up is the habit; the points follow.',
    cta:{ label:`Start ${minGoal} min of ${esc(easiest.name)}`, cat:easiest.id, goal:minGoal } });
  return out.sort((a,b) => b.prio - a.prio)[0] || null;
}
function momentCard(m, timerOn){
  if (!m) return '';
  return `<section class="moment${m.recap ? ' m-recap' : ''}" style="--tone:${m.tone}" aria-label="${esc(m.title)}">
    <button class="x m-x" data-action="hideMoment" data-k="${m.key}" aria-label="Hide for today">${ICON.x}</button>
    <h2 class="m-title">${m.title}</h2><p class="m-body">${m.body}</p>

    ${m.cta && !timerOn ? `<button class="m-cta" data-action="momentGo" data-cat="${m.cta.cat}" data-goal="${m.cta.goal}">${ICON.play}<span>${m.cta.label}</span></button>` : ''}

/* ============================ boot + auth ============================ */
async function boot(){
  applyTheme(localStorage.getItem('karma:theme') || 'system');
  if (FIREBASE_READY) {
    try { FB = await loadFirebase(); } catch (e) { console.error(e); return renderLogin('Could not load Firebase. Check your connection and config.js.'); }
    FB.A.getRedirectResult(FB.auth).catch(e => console.warn(e));
    FB.A.onAuthStateChanged(FB.auth, u => u ? startSession({ id:u.uid, email:u.email, name:u.displayName }, FirebaseStore(FB, u.uid)) : renderLogin());
  } else {
    let s = null; try { s = JSON.parse(localStorage.getItem('karma:session')); } catch {}
    s ? startSession(s, LocalStore(s.id)) : renderLogin();
  }
}
async function startSession(user, store){
  S.user = user; S.store = store;
  $('#root').innerHTML = '<div class="login"><p class="lead">Loading your karma…</p></div>';
  try { S.data = await store.loadAll(); } catch (e) { console.error(e); return renderLogin('Could not load your data. Check Firestore rules and your connection.'); }
  S.data.settings ||= {};
  if (!S.data.categories.length && !S.data.settings.seeded) {
    S.data.categories = defaultCategories(today());
    S.data.settings.seeded = true;
    await Promise.all([...S.data.categories.map(c => store.putCategory(c)), store.putSettings(S.data.settings)]).catch(() => {});
  }
  renderShell();
}
let AUTH_MODE = 'signin';
function renderLogin(error = ''){
  S.user = null;
  const testMode = !FIREBASE_READY, signup = !testMode && AUTH_MODE === 'signup';
  $('#root').innerHTML = `
  <main class="login">
    ${markSVG('mark')}
    <h1>Karma</h1>
    <p class="lead">${signup ? 'Create your account. Pick your practices next, then log your first minute.' : 'One minute, one point. Clear today, then clear what\'s carried.'}</p>
    <form id="f-login" novalidate>
      <div class="field"><label for="em">Email</label><input class="in" id="em" type="email" autocomplete="${signup ? 'email' : 'username'}" inputmode="email" required></div>
      <div class="field"><label for="pw">Password${signup ? ' (6+ characters)' : ''}</label><input class="in" id="pw" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" required></div>
      <p class="err" id="lerr" role="alert">${esc(error)}</p>

    <div class="or">or</div>
    <button class="btn gbtn" data-action="google">${gLogo()} Continue with Google</button>
    ${testMode && CFG.showDevHint ? `<p class="devhint">Test mode: sign in with <b>${esc(CFG.devCredentials.email)}</b> and <b>${esc(CFG.devCredentials.password)}</b>. Data stays in this browser until Firebase is set up.</p>` : ''}
    ${!testMode && CFG.legal ? `<p class="hint" style="margin-top:18px">By continuing you agree to the <a href="${esc(CFG.legal.terms)}">Terms</a> and <a href="${esc(CFG.legal.privacy)}">Privacy Policy</a>.</p>` : ''}

}
const AUTH_ERR = {
  'auth/invalid-credential':'That email and password don\'t match.', 'auth/wrong-password':'That email and password don\'t match.', 'auth/user-not-found':'That email and password don\'t match.',
  'auth/email-already-in-use':'That email already has an account. Sign in instead.', 'auth/weak-password':'Use at least 6 characters.',
  'auth/invalid-email':'That doesn\'t look like an email address.', 'auth/too-many-requests':'Too many attempts. Wait a few minutes and try again.',
  'auth/network-request-failed':'No connection. Check your internet and try again.', 'auth/popup-closed-by-user':'Google sign-in was closed before it finished.',
};
const authMsg = e => AUTH_ERR[e.code] || 'Something went wrong: ' + (e.code || e.message);
async function doLogin(email, pw){
  const err = $('#lerr'); email = (email || '').trim();
  if (!email || !pw) { err.textContent = 'Enter your email and password.'; return; }
  if (FIREBASE_READY) {
    try { AUTH_MODE === 'signup' ? await FB.A.createUserWithEmailAndPassword(FB.auth, email, pw) : await FB.A.signInWithEmailAndPassword(FB.auth, email, pw); }
    catch (e) { err.textContent = authMsg(e); }
    return;
  }
  const dc = CFG.devCredentials;
  if (email.toLowerCase() === dc.email.toLowerCase() && pw === dc.password) {
    const s = { id:'local-' + dc.email.toLowerCase(), email:dc.email, name:'Test user' };
    localStorage.setItem('karma:session', JSON.stringify(s));
    startSession(s, LocalStore(s.id));

}
async function doReset(){
  const email = ($('#em')?.value || '').trim(), err = $('#lerr');
  if (!email) { err.textContent = 'Enter your email above, then tap Forgot password again.'; return; }
  try { await FB.A.sendPasswordResetEmail(FB.auth, email); err.textContent = ''; toast('If that email has an account, a reset link is on its way.', 4500); }
  catch (e) { err.textContent = authMsg(e); }
}
async function deleteAccount(){
  if (prompt('This permanently deletes your account, practices and every logged minute. Type DELETE to confirm.') !== 'DELETE') { toast('Account not deleted'); return; }
  try { await S.store.deleteAccount(); setTimer(null); toast('Account deleted'); }
  catch (e) { if (e.code === 'auth/requires-recent-login') { toast('For security, sign in again, then delete your account.', 5000); signOut(); } else toast('Could not delete: ' + (e.code || e.message)); }
}
async function doGoogle(){
  if (!FIREBASE_READY || !CFG.enableGoogle) { toast('Google sign-in isn\'t set up yet. Add Firebase keys in config.js and set enableGoogle to true.', 4200); return; }
  const p = new FB.A.GoogleAuthProvider();
  try { await FB.A.signInWithPopup(FB.auth, p); }
  catch (e) { if (/popup/.test(e.code||'')) FB.A.signInWithRedirect(FB.auth, p); else toast('Google sign-in failed: ' + (e.code || e.message)); }
}
async function signOut(){
  closeFocus(); document.body.classList.remove('has-timer');
  if (FIREBASE_READY) await FB.A.signOut(FB.auth);
  else { localStorage.removeItem('karma:session'); renderLogin(); }
}

const tab = (v, label) => `<button class="tab" data-action="nav" data-view="${v}" ${S.view===v?'aria-current="page"':''}>${ICON[v]}<span>${label}</span></button>`;
function renderView(){

function greeting(){ const h = new Date().getHours(), n = firstName(); return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (n ? `, ${n}` : ''); }

function viewToday(){
  const c = calc(), t = c.totals, cats = activeCats(), tm = getTimer();
  const m = moment(c); S.moment = m;
  const minMode = m?.minMode && t.end > 0 && t.done < m.minGoal;
  const su = showUpStreak();
  let center;
  if (minMode) center = `<span class="big">${m.minGoal - t.done}</span><span class="lbl">minutes to make today count</span><span class="soft">${t.end} if you go all in</span>`;
  else if (t.owed === 0) center = `<span class="clear-word">Rest day</span><span class="lbl">Nothing due today</span>`;
  else if (t.end === 0) center = `<span class="clear-word">All clear</span><span class="lbl">${t.done} points logged today</span>`;
  else center = `<span class="big">${t.end}</span><span class="lbl">points left today</span>${t.carryLeft > 0 ? `<span class="carry">${t.carryLeft} carried over</span>` : ''}`;
  const nudge = c.streak > 0 && t.end > 0 && new Date().getHours() >= 18 ? `<div class="nudge">Clear ${t.end} more to keep your ${c.streak}-day streak</div>` : '';
  const rows = cats.map(cat => {
    const r = c.per[cat.id].today, owed = Math.max(r.owed, 1);
    const doneW = r.owed ? Math.min(100, r.done / owed * 100) : (r.done ? 100 : 0);
    const carryLeft = Math.max(0, r.opening - r.done), carryW = carryLeft / owed * 100;
    const meta = r.owed === 0 && r.done === 0 ? 'Rest day' : r.end === 0 ? `Done, ${r.done} logged` : `${r.done} of ${r.owed}${carryLeft ? `, ${carryLeft} carried` : ''}`;
    const live = tm && tm.catId === cat.id;
    const tb = live ? `<button class="tbtn live" data-action="openFocus" aria-label="Open the running ${esc(cat.name)} timer">${Math.floor(elapsedMs(tm) / 60000)}′</button>`
      : `<button class="tbtn" data-action="timerFor" data-cat="${cat.id}" aria-label="Start a ${esc(cat.name)} timer">${ICON.play}</button>`;
    const q = r.end > 0 ? `<button class="qbtn" data-action="quickAll" data-cat="${cat.id}" aria-label="Log ${r.end} minutes of ${esc(cat.name)}">+${r.end}</button>`
      : `<button class="qbtn done" data-action="log" data-cat="${cat.id}" aria-label="Log more ${esc(cat.name)}">✓</button>`;
    return `<div class="cat" style="--c:${cat.color}"><button class="cat-open" data-action="log" data-cat="${cat.id}"><span class="cat-stripe"></span>
      <span><span class="cat-name">${esc(cat.name)}</span><span class="cat-meta">${meta}</span>
      <span class="bar"><i class="b-done" style="width:${doneW}%"></i><i class="b-carry" style="width:${carryW}%"></i></span></span></button>${tb}${q}</div>`;
  }).join('');
  return `
  <header class="top">
    <div><p class="date">${fmtLong(today())}</p><h1 class="hello">${greeting()}</h1></div>
    ${c.streak ? `<div class="streak" title="Days in a row with nothing pending"><b>${c.streak}</b><span>day streak</span>${c.best > c.streak ? `<small>best ${c.best}</small>` : ''}</div>`

  ${momentCard(m, !!tm)}
  <section class="mala ${S.intro ? 'intro' : ''} ${m ? 'sm' : ''}" aria-label="Today: ${t.doneCap} of ${t.owed} points done">${malaSVG(c, cats)}<div class="mala-center">${center}</div></section>
  <p class="legend"><span><i style="background:var(--ink)"></i>Logged</span><span><i style="background:var(--due)"></i>Carried over</span><span><i style="background:var(--line)"></i>Still due</span></p>
  ${m ? '' : nudge}
  ${!tm && !m && rows && !localStorage.getItem('karma:tip-timer') ? `<div class="tip"><span class="tip-play">${ICON.play}</span><p><b>Try a focus timer.</b> Tap ▶ on any practice, do the work, then tap stop. The minutes log themselves.</p><button class="x" data-action="hideTip" aria-label="Dismiss tip">${ICON.x}</button></div>` : ''}
  ${rows || `<div class="empty">No practices yet. Add one in Setup.</div>`}
  ${rows ? `<p class="row-hint">▶ starts a timer. The coloured button logs everything left. Tap a name for other amounts.</p>` : ''}`;
}

function malaSVG(c, cats){
  const N = 108, t = c.totals, R = 128, cx = 150, cy = 150;
  const owed = t.owed;
  let fills = [];
  if (owed > 0) {
    const parts = cats.map(cat => { const r = c.per[cat.id].today; return { color:cat.color, v:Math.min(r.done, r.owed) / owed * N }; });
    const base = parts.map(p => Math.floor(p.v)); let rem = Math.round(sum(parts.map(p => p.v))) - sum(base);
    parts.map((p,i) => [p.v - base[i], i]).sort((a,b) => b[0]-a[0]).forEach(([,i]) => { if (rem > 0) { base[i]++; rem--; } });
    base.forEach((n,i) => { for (let k = 0; k < n; k++) fills.push(parts[i].color); });
    const tm = getTimer(), tc = tm && cats.find(x => x.id === tm.catId);
    if (tc) { const liveB = Math.min(N - fills.length, Math.round(Math.floor(elapsedMs(tm) / 60000) / owed * N)); for (let k = 0; k < liveB; k++) fills.push('live:' + tc.color); }
    const carryB = Math.min(N - fills.length, Math.round(t.carryLeft / owed * N));
    for (let k = 0; k < carryB; k++) fills.push('var(--due)');
  }
  let s = `<svg viewBox="0 0 300 300" role="img" aria-hidden="true">`;
  for (let i = 0; i < N; i++) {
    const a = (-90 + (i + 1) * 360 / (N + 1)) * Math.PI / 180;
    const x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
 const raw = fills[i] || 'var(--line)', isLive = raw.startsWith('live:'), fill = isLive ? raw.slice(5) : raw;
    s += `<circle class="bd${isLive ? ' live' : ''}" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="3.3" fill="${fill}" style="animation-delay:${i*7}ms"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy - R}" r="6.5" fill="var(--gold)"/><path d="M${cx} ${cy-R+6} l0 14" stroke="var(--gold)" stroke-width="2" stroke-linecap="round"/></svg>`;

function lastN(n){ const out = []; for (let i = n-1; i >= 0; i--) out.push(addDays(today(), -i)); return out; }

function viewInsights(){
  const c = calc(), T = today(), cats = [...S.data.categories].sort((a,b) => (a.order??0) - (b.order??0));
  const act = cats.filter(x => !x.archivedFrom || x.archivedFrom > T);
  const head = sub => `<header class="top"><div><p class="date">${sub}</p><h1 class="hello">Insights</h1></div></header>`;
  if (!S.data.logs.length || !cats.length) return head('Your patterns show up here') + `<div class="empty">Log a couple of days and this page starts coaching you: what's slipping, what's improving, and how close your next milestone is.</div>`;
  const earliest = cats.reduce((m,x) => x.startDate < m ? x.startDate : m, T);
  const day = d => { let due = 0, done = 0, end = 0, owed = 0; const byCat = {};
    for (const cat of cats) { const r = c.per[cat.id].byDate.get(d); if (!r) continue; due += r.due; done += r.done; end += r.end; owed += r.owed; byCat[cat.id] = r.done; }
    return { d, due, done, end, owed, byCat }; };
  const span = (n, endD = T) => { const a = []; for (let i = n-1; i >= 0; i--) { const d = addDays(endD, -i); if (d >= earliest) a.push(d); } return a; };
  const hit = rows => { const r = rows.filter(x => x && x.due > 0); return r.length ? Math.round(sum(r.map(x => Math.min(x.done, x.due))) / sum(r.map(x => x.due)) * 100) : null; };
  const isClear = r => r.owed > 0 && r.end === 0;
  const DN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const deltaHtml = (a, b, unit = '') => { if (b === null || b === undefined || a === null) return `<span class="delta flat">no data last week</span>`;
    const d = a - b; return d === 0 ? `<span class="delta flat">same as last week</span>` : `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '↑' : '↓'} ${Math.abs(d)}${unit} vs last week</span>`; };

  // --- this week vs same point last week (Mon-based) ---
  const dow = (parse(T).getDay() + 6) % 7;
  const thisW = span(dow + 1).map(day), lastW = span(dow + 1, addDays(T, -7)).map(day);
  const pts = rows => sum(rows.map(r => r.done)), clr = rows => rows.filter(isClear).length;
  const lastWHas = lastW.length > 0;
  const wk = `<div class="wk">
    <div><b>${pts(thisW)}</b><span class="l">points this week</span>${lastWHas ? deltaHtml(pts(thisW), pts(lastW)) : ''}</div>
    <div><b>${hit(thisW) ?? 0}%</b><span class="l">of target</span>${lastWHas ? deltaHtml(hit(thisW) ?? 0, hit(lastW), ' pts') : ''}</div>
    <div><b>${clr(thisW)}</b><span class="l">clear day${clr(thisW) === 1 ? '' : 's'}</span>${lastWHas ? deltaHtml(clr(thisW), clr(lastW)) : ''}</div></div>`;

  // --- practice health ---
  const ph = act.map(cat => {
    const P = c.per[cat.id].byDate, rows = (n, e) => span(n, e).map(d => P.get(d)).filter(Boolean);
    let st = 0, d = P.get(T) && isClear(P.get(T)) ? T : addDays(T, -1);
    while (P.get(d) && P.get(d).end === 0) { if (P.get(d).due > 0) st++; d = addDays(d, -1); }
    const last7 = rows(7, addDays(T, -1)).filter(r => r.due > 0);
    const strip = span(14).map(d => { const r = P.get(d); if (!r) return 'none'; if (!r.due) return r.done ? 'met' : 'rest';
      if (d === T && r.done < r.due) return r.done ? 'part' : 'today'; return r.done >= r.due ? 'met' : r.done > 0 ? 'part' : 'miss'; });
    return { cat, st, hr14:hit(rows(14)), hrPrev:hit(rows(14, addDays(T, -14))), misses:last7.filter(r => r.done < r.due).length, n7:last7.length,
      strip, total:sum([...P.values()].map(r => r.done)), target:targetMinutesOn(cat, T) };
  });

  // --- weekday rhythm (last 8 weeks) ---
  const wdRows = [[],[],[],[],[],[],[]];
  span(56, addDays(T, -1)).forEach(d => wdRows[parse(d).getDay()].push(day(d)));
  const wdHit = wdRows.map(r => r.filter(x => x.due > 0).length >= 2 ? hit(r) : null);
  const valid = wdHit.map((v,i) => [v,i]).filter(([v]) => v !== null);
  const weakest = valid.length >= 4 ? valid.reduce((a,b) => b[0] < a[0] ? b : a) : null;
  const strongest = valid.length >= 4 ? valid.reduce((a,b) => b[0] > a[0] ? b : a) : null;
  const otherAvg = weakest ? Math.round(sum(valid.filter(([,i]) => i !== weakest[1]).map(([v]) => v)) / Math.max(1, valid.length - 1)) : 0;

  // --- backlog pace ---
  const r14 = span(14, addDays(T, -1)).map(day);
  const surplus = r14.length ? (sum(r14.map(r => r.done)) - sum(r14.map(r => r.due))) / r14.length : 0;
  const backlog = c.totals.carryLeft;

  // --- coach lines (rule-based, highest priority first) ---
  const tips = [], add = (score, tone, html) => tips.push({ score, tone, html });
  if (c.streak > 0 && c.best > c.streak && c.best - c.streak <= 3) add(96, 'var(--gold)', `<b>${c.best - c.streak + 1} more clear day${c.best - c.streak ? 's' : ''} sets a new record.</b> Your best run is ${c.best}.`);
  if (c.streak >= 3 && c.streak === c.best) add(88, 'var(--gold)', `<b>This is your longest run ever: ${c.streak} clear days.</b> Every day from here is a new record.`);
  ph.forEach(p => {

  if (weakest && otherAvg - weakest[0] >= 20) add(78, 'var(--due)', `<b>${DN[weakest[1]]}s are your weak spot.</b> ${weakest[0]}% of target, against ${otherAvg}% on other days. Plan something small for ${DN[weakest[1]]}.`);
  if (backlog > 0 && r14.length >= 5) {

    else add(80, 'var(--due)', `<b>Your backlog isn't shrinking.</b> ${Math.ceil(backlog / 7)} extra points a day clears all ${backlog} within a week.`);
  }
  if (lastWHas && pts(lastW) > 0) { const d = Math.round((pts(thisW) - pts(lastW)) / pts(lastW) * 100);
    if (d >= 10) add(58, 'var(--ok)', `<b>You're ${d}% ahead of last week</b> at this point in the week.`);
    if (d <= -15) add(66, 'var(--due)', `<b>You're ${-d}% behind last week</b> at this point. Today's ${c.totals.end} points would close most of the gap.`); }
  tips.sort((a,b) => b.score - a.score);
  // lead with one win, then up to two fixes: wins keep motivation up, fixes give direction
  const win = tips.find(t => t.tone !== 'var(--due)'), fixes = tips.filter(t => t.tone === 'var(--due)');
  const coachLines = (win ? [win, ...fixes.slice(0, 2)] : fixes.slice(0, 3));
  if (coachLines.length < 3) coachLines.push(...tips.filter(t => !coachLines.includes(t)).slice(0, 3 - coachLines.length));
  if (!coachLines.length) coachLines.push({ tone:'var(--ok)', html:'<b>Steady.</b> Nothing is slipping. Keep showing up and the streak takes care of itself.' });
  const coach = `<section class="coach" aria-label="What to do next"><h2>What to do next</h2><ul>${coachLines.map(t => `<li style="--tone:${t.tone}"><i></i><span>${t.html}</span></li>`).join('')}</ul></section>`;

  // --- consistency calendar (16 weeks, Monday rows on top) ---
  const WEEKS = 16, cell = 16, g = 3, left = 22, top = 14;
  const startMon = addDays(T, -((dow) + 7 * (WEEKS - 1)));
  let heat = `<svg class="chart heat" viewBox="0 0 ${left + WEEKS * (cell + g)} ${top + 7 * (cell + g)}">`;
  ['M','','W','','F','','S'].forEach((l,i) => { if (l) heat += `<text x="0" y="${top + i * (cell + g) + 12}">${l}</text>`; });
  let lastMonth = -1;
  for (let w = 0; w < WEEKS; w++) for (let r = 0; r < 7; r++) {
    const d = addDays(startMon, w * 7 + r), x = left + w * (cell + g), y = top + r * (cell + g);
    if (r === 0) { const m = parse(d).getMonth(); if (m !== lastMonth) { lastMonth = m; heat += `<text x="${x}" y="9">${parse(d).toLocaleDateString(undefined,{month:'short'})}</text>`; } }
    if (d > T || d < earliest) { if (d <= T) heat += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3.5" fill="var(--surface-2)" opacity=".35"/>`; continue; }
    const row = day(d); let fill, op = 1, stroke = '';
    if (!row.due && !row.done && !row.owed) { fill = 'transparent'; stroke = 'stroke="var(--line)" stroke-width="1.5"'; }
    else if (isClear(row)) fill = 'var(--ok)';
    else { const q = row.due ? row.done / row.due : 0;
      if (d === T && q < 1) { fill = 'transparent'; stroke = 'stroke="var(--ok)" stroke-width="2"'; }
      else if (q >= 1) { fill = 'var(--ok)'; op = .7; } else if (q >= .5) { fill = 'var(--ok)'; op = .42; } else if (q > 0) { fill = 'var(--ok)'; op = .2; } else fill = 'var(--due-soft)'; }
    heat += `<rect x="${x}" y="${y}" width="${cell}" height="${cell}" rx="3.5" fill="${fill}" opacity="${op}" ${stroke}><title>${fmtShort(d)}: ${row.done} of ${row.due} points</title></rect>`;
  }

  const clearDaysAll = (() => { let n = 0; for (let d = earliest; d <= T; d = addDays(d, 1)) if (isClear(day(d))) n++; return n; })();

  // --- milestones + records ---
  const totalMin = sum(S.data.logs.map(l => l.minutes)), hours = totalMin / 60;
  const nextOf = (v, list) => list.find(x => x > v) ?? Math.ceil((v + 1) / 100) * 100;
  const prevOf = (v, list) => [0, ...list].filter(x => x <= v).pop();
  const stNext = nextOf(c.streak, [3,7,14,21,30,50,75,100,108,150,200,365]), stPrev = prevOf(c.streak, [3,7,14,21,30,50,75,100,108,150,200,365]);
  const hNext = nextOf(hours, [5,10,25,50,100,200,300,500,750,1000]), hPrev = prevOf(hours, [5,10,25,50,100,200,300,500,750,1000]);

  const allDays = []; for (let d = earliest; d <= T; d = addDays(d, 1)) allDays.push(day(d));

  const ms = `<section class="panel"><div class="panel-h"><h3>Next milestones</h3></div><p class="sub">Effort climbs as the finish line gets close. Here's how close.</p>

    <div class="ms"><div class="ms-top"><b>${hNext} hours of practice</b><span>${Math.ceil((hNext - hours) * 60)} points to go</span></div><div class="bar"><i style="width:${pc(hours, hPrev, hNext)}%"></i></div></div>
    <div class="recs"><div><b>${hours >= 10 ? Math.round(hours) : hours.toFixed(1)} h</b><span>practised since ${fmtShort(earliest)}</span></div>
      <div><b>${c.best}</b><span>longest streak</span></div>
      <div><b>${bestDay.done}</b><span>best day${bestDay.done ? `, ${fmtShort(bestDay.d)}` : ''}</span></div>

  // --- practice health html ---
  const phHtml = `<section class="panel"><div class="panel-h"><h3>Practice health</h3><small>last 14 days</small></div><p class="sub">Solid is met, faded is partial, red is missed, outlined is a rest day.</p>
    ${ph.map(p => { const tr = p.hr14 !== null && p.hrPrev !== null ? p.hr14 - p.hrPrev : null;
      return `<div class="ph" style="--c:${p.cat.color}"><div class="ph-top"><span class="ph-name"><i></i>${esc(p.cat.name)}</span>
        ${p.st ? `<span class="ph-st">${p.st}-day streak</span>` : `<span class="ph-st zero">no streak yet</span>`}</div>
        <div class="strip">${p.strip.map(x => `<i class="${x}"></i>`).join('')}</div>
        <div class="ph-meta"><span>${p.hr14 ?? 0}% of target${tr !== null && tr !== 0 ? ` <span class="${tr > 0 ? 'up' : 'down'}">${tr > 0 ? '↑' : '↓'}${Math.abs(tr)}</span>` : ''}</span><span>${(p.total / 60).toFixed(p.total >= 600 ? 0 : 1)} h total</span></div></div>`; }).join('')}</section>`;

  const wsvg = `<svg class="chart" viewBox="0 0 ${W} 104">${order.map((k,i) => { const bw = 32, x = i * (W - bw) / 6, v = wdHit[k], h = v === null ? 0 : v / 100 * 68;
    const col = weakest && k === weakest[1] ? 'var(--due)' : strongest && k === strongest[1] ? 'var(--ok)' : 'var(--ink)';
    return `<rect x="${x}" y="${74 - Math.max(h, 2)}" width="${bw}" height="${Math.max(h, 2)}" rx="6" fill="${col}" opacity="${col === 'var(--ink)' ? .55 : 1}"/>
      <text x="${x + bw/2}" y="${70 - h}" text-anchor="middle" style="font-weight:700">${v === null ? '' : v + '%'}</text><text x="${x + bw/2}" y="94" text-anchor="middle">${DN[k].slice(0,3)}</text>`; }).join('')}</svg>`;
  const buckets = [['Morning',5,12,'var(--gold)'],['Afternoon',12,17,'#3E5BA9'],['Evening',17,22,'#8A4FA3'],['Night',22,29,'var(--ink)']];
  const since = addDays(T, -30), tod = [0,0,0,0];
  S.data.logs.filter(l => l.date >= since && l.createdAt).forEach(l => { let h = new Date(l.createdAt).getHours(); if (h < 5) h += 24; const i = buckets.findIndex(b => h >= b[1] && h < b[2]); if (i >= 0) tod[i] += l.minutes; });
  const todSum = sum(tod), topB = todSum ? tod.indexOf(Math.max(...tod)) : -1;

    <div class="tod-key">${buckets.map(b => `<span style="--k:${b[3]}">${b[0]}</span>`).join('')}</div>` : '';

    if (r.due) bars += `<rect x="${(x - 1).toFixed(1)}" y="${(y(r.due) - 1).toFixed(1)}" width="${(bw + 2).toFixed(1)}" height="2.5" rx="1" fill="var(--ink)"/>`;

function viewHistory(){

  <p class="hint" style="text-align:left;margin:-6px 2px 22px">The most each practice can carry into a new day, measured in days of its target. Misses beyond that are forgiven, so a bad week never becomes a hole you can't climb out of.</p>

const getTimer = () => { try { return JSON.parse(localStorage.getItem('karma:timer')); } catch { return null; } };

function fmtClock(ms){ const x = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60); return h ? `${h}:${pad(m)}:${pad(x % 60)}` : `${m}:${pad(x % 60)}`; }

let audio = null;
function primeAudio(){ try { audio ||= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {} }
function chime(){ try { if (!audio) return; const t0 = audio.currentTime;
  [[660,0],[880,.18],[1100,.36]].forEach(([f,d]) => { const o = audio.createOscillator(), g = audio.createGain(); o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0+d); g.gain.linearRampToValueAtTime(.25, t0+d+.02); g.gain.exponentialRampToValueAtTime(.001, t0+d+.5); o.connect(g).connect(audio.destination); o.start(t0+d); o.stop(t0+d+.55); }); } catch {} }
let wake = null;
async function requestWake(){ try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch {} const w = $('#fwake'); if (w) w.textContent = wake ? 'Screen stays on' : ''; }
function releaseWake(){ try { wake?.release(); } catch {} wake = null; }

function startTimerFor(catId, goalOverride){
  const cur = getTimer(), cat = S.data.categories.find(c => c.id === catId);
  if (cur && cur.catId === catId) { openFocus(); return; }
  if (cur) {
    const other = S.data.categories.find(c => c.id === cur.catId), m = Math.floor(elapsedMs(cur) / 60000);
    if (!confirm(`Stop the ${other?.name || ''} timer${m ? ` and log ${m} min` : ''}, then start ${cat.name}?`)) return;
    setTimer(null); if (m >= 1) logEntry(cur.catId, m, today());
  }
  const left = calc().per[catId].today.end;
  primeAudio(); haptic(12);
  setTimer({ catId, startedAt:Date.now(), pausedMs:0, pausedAt:null, goal: goalOverride || (left >= 5 ? Math.min(left, 120) : 25), alerted:false });
  localStorage.setItem('karma:tip-timer', '1');

}

}
function openFocus(){
  if (!getTimer()) return;
  let el = $('#focus'); if (!el) { el = document.createElement('div'); el.id = 'focus'; el.className = 'focus'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Focus timer'); document.body.appendChild(el); }

}
function closeFocus(){ $('#focus')?.remove(); releaseWake(); }
function renderFocus(){
  const el = $('#focus'); if (!el) return;
  const tm = getTimer(), cat = tm && S.data.categories.find(c => c.id === tm.catId);
  if (!cat) { closeFocus(); return; }
  const left = calc().per[cat.id].today.end, B = Math.min(tm.goal, 60), R = 132, cx = 150, cy = 150;
  let ring = `<svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="112" fill="none" stroke="var(--surface-2)" stroke-width="6"/>
    <circle class="f-arc" id="farc" cx="150" cy="150" r="112" fill="none" stroke="var(--c)" stroke-width="6" stroke-linecap="round" transform="rotate(-90 150 150)" stroke-dasharray="${(2*Math.PI*112).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*112).toFixed(1)}"/>`;
  for (let i = 0; i < B; i++) { const a = (-90 + (i + .5) * 360 / B) * Math.PI / 180;
    ring += `<circle id="fb${i}" cx="${(cx + R*Math.cos(a)).toFixed(1)}" cy="${(cy + R*Math.sin(a)).toFixed(1)}" r="${B > 40 ? 4 : 5.5}" fill="var(--line)"/>`; }
  ring += `</svg>`;
  const goals = [...new Set([15, 25, 45, ...(left >= 5 && left <= 180 ? [left] : [])])].sort((a,b) => a - b);

  </div>
  <div class="f-actions">

    <div class="row2"><button class="btn btn-2" data-action="pauseTimer">${tm.pausedAt ? 'Resume' : 'Pause'}</button><button class="btn btn-2" data-action="cancelTimer">Discard</button></div>
  </div>`;
  updateFocus();
}
function updateFocus(){
  const tm = getTimer(); if (!tm || !$('#focus')) return;
  const ms = elapsedMs(tm), goalMs = tm.goal * 60000, B = Math.min(tm.goal, 60), pts = Math.floor(ms / 60000);
  const filled = Math.min(B, Math.floor(ms / (goalMs / B)));
  for (let i = 0; i < B; i++) { const b = document.getElementById('fb' + i); if (b) b.setAttribute('fill', i < filled ? (ms >= goalMs ? 'var(--gold)' : 'var(--c)') : 'var(--line)'); }
  const arc = $('#farc'), C = 2 * Math.PI * 112; if (arc) arc.setAttribute('stroke-dashoffset', (C * (1 - Math.min(1, ms / goalMs))).toFixed(1));
  const toGo = Math.ceil((goalMs - ms) / 60000);
  $('#fpts').textContent = `${pts} point${pts === 1 ? '' : 's'} so far`;
  $('#fsub').textContent = tm.pausedAt ? 'Paused' : ms < goalMs ? `${toGo} min to target` : `Target reached, ${pts - tm.goal} min extra`;
  $('#fstop').textContent = pts >= 1 ? `Stop and log ${pts} min` : 'Stop';
}
let lastTickMin = -1;
function tick(){
  const tm = getTimer();
  if (!tm || !S.user) { if (document.title !== 'Karma') document.title = 'Karma'; return; }
  const cat = S.data.categories.find(c => c.id === tm.catId); if (!cat) { setTimer(null); return; }
  const ms = elapsedMs(tm), clock = fmtClock(ms);
  document.title = `${clock} ${cat.name}`;
  document.querySelectorAll('[data-clock]').forEach(e => e.textContent = clock);
  document.querySelectorAll('[data-prog]').forEach(e => e.style.width = Math.min(100, ms / (tm.goal * 600)) + '%');
  updateFocus();
  if (!tm.alerted && ms >= tm.goal * 60000) {
    tm.alerted = true; setTimer(tm); chime(); haptic([30, 80, 30, 80, 60]);
    toast(`${cat.name}: ${tm.goal} min target reached. Keep going or stop to log.`, 6000);
  }
  const m = Math.floor(ms / 60000);
  if (m !== lastTickMin) { lastTickMin = m; if (S.view === 'today' && !$('#sheet')?.innerHTML) renderView(); }
}
setInterval(tick, 1000);

/* ============================ mutations ============================ */
async function persist(fn, okMsg){
  try { await fn(); if (okMsg) toast(okMsg); } catch (e) { console.error(e); toast('Could not save. Check your connection.'); }
  renderView();
}
const haptic = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };
function logEntry(catId, mins, date, note = ''){
  if (!(mins > 0 && mins <= 1440)) { toast('Enter between 1 and 1440 minutes'); return; }
  if (date > today()) date = today();
  const before = calc(), cat = S.data.categories.find(c => c.id === catId);
  const l = { id:newId(), catId, date, minutes:mins, note, createdAt:Date.now() };
  S.data.logs.push(l);
  S.store.addLog(l).catch(() => toast('Could not save. Check your connection.'));
  const after = calc(); renderView(); haptic(12);
  const undo = () => { S.data.logs = S.data.logs.filter(x => x.id !== l.id); S.store.deleteLog(l).catch(() => {}); renderView(); toast('Undone'); };
  if (before.totals.end > 0 && after.totals.end === 0) return celebrate(after, undo);
  const mm = S.moment;
  if (mm?.minMode && before.totals.done < mm.minGoal && after.totals.done >= mm.minGoal) { haptic([15, 50, 25]); return toast('Today counts. Anything more is a bonus.', 4500, undo); }
  const cleared = before.per[catId].today.end > 0 && after.per[catId].today.end === 0;
  toast(cleared ? `${cat.name} done for today` : `+${mins} ${cat.name}${date !== today() ? `, ${dayLabel(date)}` : ''}`, 4500, undo);
}
function celebrate(c, undo){
  haptic([15, 60, 15, 60, 40]); document.querySelector('.toast')?.remove();
  const milestone = { 3:'Three days running.', 7:'A full week.', 21:'21 days. This is a habit now.', 30:'A month without a gap.', 50:'Fifty days.', 100:'A hundred days.', 108:'108 days. A full mala.' }[c.streak] || '';
  const el = document.createElement('div'); el.className = 'celebrate'; el.setAttribute('role', 'status');
  el.innerHTML = `<div>${markSVG('cel-mark', 27, 'var(--gold)')}<span class="clear-word">All clear</span>
    <p>${c.streak > 1 ? `${c.streak}-day streak. ` : 'Nothing left today. '}${milestone}</p><button class="btn btn-2" type="button">Undo last entry</button></div>`;
  document.body.appendChild(el);
  const close = () => el.remove(), tm = setTimeout(close, 3200);
  el.addEventListener('click', e => { clearTimeout(tm); close(); if (e.target.closest('button')) undo(); });
}
function saveCustom(){ const mins = parseInt($('#mins').value, 10); if (!(mins > 0)) { toast('Enter the minutes'); return; } const n = readNote(); closeSheet(); logEntry(LOG.catId, mins, LOG.date, n); }
async function saveCat(){
  const name = $('#cn').value.trim(), minutes = parseInt($('#cm').value, 10), start = EDIT.start || today();
  if (!name) { toast('Give the practice a name'); return; }
  if (!(minutes > 0 && minutes <= 1440)) { toast('Minutes a day must be between 1 and 1440'); return; }
  if (!EDIT.days.length) { toast('Pick at least one day'); return; }
  let cat = S.data.categories.find(c => c.id === EDIT.id);
  if (cat) {
    cat = JSON.parse(JSON.stringify(cat));
    cat.name = name; cat.color = EDIT.color; cat.startDate = start;
    const t = { from:today(), minutes, days:[...EDIT.days].sort() };
    const last = cat.targets[cat.targets.length - 1];
    if (last.minutes !== t.minutes || last.days.join() !== t.days.join()) {
      if (last.from >= today()) cat.targets[cat.targets.length - 1] = { ...t, from:last.from };
      else cat.targets.push(t);
    }
    cat.targets[0].from = start;
    cat.targets = cat.targets.filter((x,i) => i === 0 || x.from > start);
    S.data.categories = S.data.categories.map(c => c.id === cat.id ? cat : c);
  } else {
    cat = { id:newId(), name, color:EDIT.color, order:S.data.categories.length, startDate:start, archivedFrom:null, targets:[{ from:start, minutes, days:[...EDIT.days].sort() }] };
    S.data.categories.push(cat);
  }
  closeSheet(); persist(() => S.store.putCategory(cat), EDIT.id ? 'Saved changes' : `Added ${name}`);
}
function sampleData(){
  const DAYS = 70, start = addDays(today(), -DAYS), cats = defaultCategories(start), logs = [];
  cats[2].targets[0].days = [1,2,3,4,5]; // course study on weekdays
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const carry = cats.map(() => 0), cap = 2;
  for (let i = 0; i <= DAYS; i++) {
    const d = addDays(start, i), isToday = d === today(), wd = parse(d).getDay();
    cats.forEach((c, ci) => {
      const due = dueOn(c, d); carry[ci] = Math.min(carry[ci], cap * targetMinutesOn(c, d));
      const owed = carry[ci] + due; if (!owed) return;
      let m;
      if (isToday) m = ci < 2 ? Math.round(due * .5) : 0;
      else {
        let p = .8 + i / DAYS * .12;                      // improving over time
        if (wd === 6) p -= .45;                           // weak Saturdays
        if (ci === 3 && i > DAYS - 9) p = .3;             // meditation slipping lately
        if (i > DAYS - 9 && ci !== 3) p = 1;              // a recent run on the rest
        const r = rnd();
        if (r > p) m = 0;
        else if (rnd() < .12 && due) m = Math.round(due * (.4 + rnd() * .4) / 5) * 5;  // partial day
        else m = owed;                                    // full day, catching up on anything carried
      }
      carry[ci] = Math.max(0, owed - (m || 0));
      const hour = ci === 0 ? 7 : ci === 3 ? 6 : ci === 1 ? 21 : 19;
      if (m > 0) logs.push({ id:newId(), catId:c.id, date:d, minutes:m, note:'', createdAt:isToday ? Date.now() - 3600e3 : parse(d).getTime() + hour * 3600e3 + ci * 60e3 });
    });
  }
  return { categories:cats, logs, settings:{ ...S.data.settings, seeded:true } };
}
