  quick: el => { const n = readNote(); closeSheet(); logEntry(LOG.catId, Number(el.dataset.v), LOG.date, n); },
  custom: () => { readNote(); LOG.custom = !LOG.custom; renderLogSheet(); },
  noteToggle: () => { LOG.noteOpen = true; renderLogSheet(); setTimeout(() => $('#ln')?.focus(), 30); },
  pickCat: el => { readNote(); LOG.catId = el.dataset.id; renderLogSheet(); haptic(6); },
  when: el => { readNote(); if (el.dataset.d === 'other') { LOG.other = true; LOG.date = addDays(today(), -3); } else { LOG.other = false; LOG.date = el.dataset.d; } renderLogSheet(); },
  startTimer: () => startTimerFor(LOG.catId),
  timerFor: el => startTimerFor(el.dataset.cat),
  openFocus: () => openFocus(),
  minFocus: () => { closeFocus(); renderView(); },
  hideTip: () => { localStorage.setItem('karma:tip-timer', '1'); renderView(); },
  goal: el => { const tm = getTimer(); if (!tm) return; tm.goal = Number(el.dataset.v); tm.alerted = elapsedMs(tm) >= tm.goal * 60000; setTimer(tm); renderFocus(); renderMini(); },
  pauseTimer: () => { const tm = getTimer(); if (!tm) return;
    if (tm.pausedAt) { tm.pausedMs = (tm.pausedMs || 0) + (Date.now() - tm.pausedAt); tm.pausedAt = null; } else tm.pausedAt = Date.now();
    setTimer(tm); haptic(8); renderFocus(); renderView(); },
  stopTimer: () => { const tm = getTimer(); if (!tm) return; const ms = elapsedMs(tm), mins = Math.floor(ms / 60000);
    if (mins < 1) { setTimer(null); closeFocus(); renderView(); toast('Under a minute, so nothing was logged'); return; }
    if (mins > 240 && !confirm(`The timer ran for ${fmtClock(ms)}. Log all ${mins} minutes?`)) { setTimer(null); closeFocus(); openLog(tm.catId); LOG.custom = true; renderLogSheet(); return; }
    setTimer(null); closeFocus(); document.title = 'Karma'; logEntry(tm.catId, mins, today()); },
  cancelTimer: () => { const tm = getTimer(); if (!tm) return; const m = Math.floor(elapsedMs(tm) / 60000);
    if (m >= 2 && !confirm(`Discard ${m} minutes without logging them?`)) return;
    setTimer(null); closeFocus(); document.title = 'Karma'; renderView(); toast('Timer discarded'); },
  close: closeSheet,
  google: doGoogle,
  momentGo: el => startTimerFor(el.dataset.cat, Number(el.dataset.goal) || undefined),
  hideMoment: el => { localStorage.setItem('karma:moment:' + today(), el.dataset.k); renderView(); },
  authMode: () => { AUTH_MODE = AUTH_MODE === 'signup' ? 'signin' : 'signup'; const em = $('#em')?.value; renderLogin(); if (em) $('#em').value = em; },
  resetPw: doReset,
  deleteAccount: deleteAccount,
  signOut: () => { if (confirm('Sign out?')) signOut(); },
  step: el => { const i = $('#' + el.dataset.t); i.value = Math.max(1, (parseInt(i.value,10) || 0) + Number(el.dataset.d)); haptic(4); },
  setVal: el => { $('#' + el.dataset.t).value = el.dataset.v; haptic(4); },
  editCat: el => openEditCat(el.dataset.id),
  day: el => { const d = Number(el.dataset.d); EDIT.days = EDIT.days.includes(d) ? EDIT.days.filter(x => x !== d) : [...EDIT.days, d]; el.setAttribute('aria-pressed', EDIT.days.includes(d)); },
  start: el => { EDIT.start = el.dataset.d; document.querySelectorAll('[data-action="start"]').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  showStart: el => { el.closest('.since').hidden = true; const i = $('#cs'); i.hidden = false; i.focus(); try { i.showPicker(); } catch {} },
  color: el => { EDIT.color = el.dataset.c; document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b === el)); },
  archive: el => { const c = JSON.parse(JSON.stringify(S.data.categories.find(x => x.id === el.dataset.id)));
    c.archivedFrom = c.archivedFrom ? null : today(); S.data.categories = S.data.categories.map(x => x.id === c.id ? c : x);
    closeSheet(); persist(() => S.store.putCategory(c), c.archivedFrom ? `Archived ${c.name}. Its backlog is cleared.` : `Restored ${c.name}`); },
  delCat: el => { const c = S.data.categories.find(x => x.id === el.dataset.id);
    if (!confirm(`Delete ${c.name} and all its logged minutes? Archive keeps the history instead.`)) return;
    S.data.categories = S.data.categories.filter(x => x.id !== c.id); S.data.logs = S.data.logs.filter(l => l.catId !== c.id);
    closeSheet(); persist(() => S.store.deleteCategory(c.id), `Deleted ${c.name}`); },
  delLog: el => { const l = S.data.logs.find(x => x.id === el.dataset.id); if (!l) return;
    S.data.logs = S.data.logs.filter(x => x.id !== l.id); S.store.deleteLog(l).catch(() => {}); renderView();
    toast('Entry deleted', 4500, () => { S.data.logs.push(l); S.store.addLog(l).catch(() => {}); renderView(); }); },
  cap: el => { S.data.settings = { ...S.data.settings, backlogCap:Number(el.dataset.v) }; persist(() => S.store.putSettings(S.data.settings), Number(el.dataset.v) ? `Backlog capped at ${el.dataset.v} day${el.dataset.v === '1' ? '' : 's'} per practice` : 'Backlog has no limit'); },
  range: el => { S.range = Number(el.dataset.n); renderView(); },
  theme: el => { localStorage.setItem('karma:theme', el.dataset.t); applyTheme(el.dataset.t); renderView(); },
  sample: () => { if (!confirm('Replace all your data with sample data?')) return; S.data = sampleData(); S.intro = true; persist(() => S.store.replaceAll(S.data), 'Sample data loaded'); },
  reset: () => { if (!confirm('Delete all logs and reset to the default practices?')) return; S.data = { categories:defaultCategories(today()), logs:[], settings:{ seeded:true } }; persist(() => S.store.replaceAll(S.data), 'Started over'); },
  export: () => { const b = new Blob([JSON.stringify({ app:'karma', version:1, exportedAt:new Date().toISOString(), ...S.data }, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `karma-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-action]'); if (!el) return; const fn = Actions[el.dataset.action]; if (fn) { e.preventDefault(); fn(el, e); } });
document.addEventListener('submit', e => { e.preventDefault(); ({ 'f-login': () => doLogin($('#em').value, $('#pw').value), 'f-log': saveCustom, 'f-cat': saveCat })[e.target.id]?.(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#focus')) { closeFocus(); renderView(); } else closeSheet(); } });
document.addEventListener('change', async e => {
  if (e.target.id === 'ld') { readNote(); LOG.date = e.target.value && e.target.value <= today() ? e.target.value : today(); renderLogSheet(); return; }
  if (e.target.id === 'cs') { if (e.target.value && e.target.value <= today()) EDIT.start = e.target.value; return; }
  if (e.target.id !== 'imp' || !e.target.files[0]) return;
  try { const d = JSON.parse(await e.target.files[0].text());
    if (!Array.isArray(d.categories) || !Array.isArray(d.logs)) throw new Error('bad');
    if (!confirm(`Import ${d.categories.length} practices and ${d.logs.length} entries? This replaces your current data.`)) return;
    S.data = { categories:d.categories, logs:d.logs, settings:d.settings || { seeded:true } }; persist(() => S.store.replaceAll(S.data), 'Backup imported');
  } catch { toast('That file isn\'t a Karma backup'); }
});
// re-render at midnight / when returning to the app so "today" and the timer stay right
let lastDay = today();
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.user) { lastDay = today(); renderView(); if ($('#focus')) { renderFocus(); requestWake(); } tick(); } });

/* ============================ misc ============================ */
function applyTheme(t){ if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); }
let toastT;
function toast(msg, ms = 2600, undo){
  document.querySelector('.toast')?.remove();
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  const sp = document.createElement('span'); sp.textContent = msg; t.appendChild(sp);
  if (undo) { const b = document.createElement('button'); b.className = 'tundo'; b.type = 'button'; b.textContent = 'Undo'; b.onclick = () => { t.remove(); undo(); }; t.appendChild(b); }
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), ms);
}
function markSVG(cls, filled = 18, color = 'var(--ink)'){ let s = `<svg class="${cls}" viewBox="0 0 100 100" aria-hidden="true">`; const N = 27;
  for (let i = 0; i < N; i++) { const a = (-90 + (i+1) * 360 / (N+1)) * Math.PI / 180; s += `<circle cx="${(50+38*Math.cos(a)).toFixed(1)}" cy="${(50+38*Math.sin(a)).toFixed(1)}" r="3.6" fill="${i < filled ? color : 'var(--line)'}"/>`; }
  return s + `<circle cx="50" cy="12" r="6" fill="var(--gold)"/></svg>`; }
function gLogo(){ return `<svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>`; }

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
</script>
